<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>suryaamitrano</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Caveat+Brush&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Fraunces, Georgia, serif;
    color: #2f2a22;
    background: #f9e6c6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="refined.jsx"></script>
<script type="text/babel" src="pages-refined.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

// Project view: opens when a portfolio item is clicked.
// Shows editions (e.g. PT / EN versions of a book), an image gallery,
// a description and an optional link. See the PORTFOLIO notes in shared.jsx.
const CAT_TKEY = { books: 'catBooks', brand: 'catBrand', illustration: 'catIllustration', music: 'catMusic' };

function ProjectView({ item, onClose, onPrev, onNext, lang, t }) {
  const editions = (item && item.editions) || null;
  const pickEdition = () => {
    if (!editions) return 0;
    const i = editions.findIndex(e => e.lang === lang);
    return i >= 0 ? i : 0;
  };
  const [ed, setEd] = useState(pickEdition);
  const [img, setImg] = useState(0);
  useEffect(() => { setEd(pickEdition()); setImg(0); }, [item && item.id]);

  useEffect(() => {
    if (!item) return;
    const h = (e) => {
      if (e.key === 'Escape') onClose();
      if (e.key === 'ArrowLeft') onPrev();
      if (e.key === 'ArrowRight') onNext();
    };
    window.addEventListener('keydown', h);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', h); document.body.style.overflow = prevOverflow; };
  }, [item, onClose, onPrev, onNext]);
  if (!item) return null;

  const edition = editions ? editions[Math.min(ed, editions.length - 1)] : null;
  const title = edition ? edition.title : item.title;
  const cover = edition ? edition.image : item.image;
  const gallery = [cover, ...((edition && edition.images) || []), ...(item.images || [])].filter(Boolean);
  const current = gallery[Math.min(img, gallery.length - 1)];
  const desc = item.desc && (item.desc[lang] || item.desc.en);
  const linkLabel = item.link && ((item.link.label && (item.link.label[lang] || item.link.label.en)) || t.projectLinkDefault);
  const cream = '#f9e6c6';

  return (
    <div onClick={onClose} className="pv-overlay" style={{
      position: 'fixed', inset: 0, background: 'rgba(20,18,14,.86)', zIndex: 100,
      display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '40px 88px',
      animation: 'fadeIn .2s ease', overflowY: 'auto',
    }}>
      <style>{`
        @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
        @media (max-width: 820px) {
          .pv-overlay { padding: 16px !important; align-items: flex-start !important; background: rgba(20,18,14,.97) !important; }
          .pv-body { grid-template-columns: 1fr !important; padding-bottom: 72px; }
          .pv-nav { top: auto !important; bottom: 16px !important; transform: none !important; }
          .pv-main-img { max-height: 60vh !important; }
        }
      `}</style>
      <button aria-label="previous" className="pv-nav" onClick={(e) => { e.stopPropagation(); onPrev(); }} style={navBtn(16)}><Icon name="arrow-left" size={20} /></button>

      <div onClick={(e) => e.stopPropagation()} className="pv-body" style={{
        width: '100%', maxWidth: 1080, display: 'grid', gridTemplateColumns: '1.35fr 1fr', gap: 40,
        alignItems: 'start', color: cream,
      }}>
        {/* Images */}
        <div>
          {current
            ? <img key={current} src={current} alt={title} className="pv-main-img" style={{ display: 'block', width: '100%', maxHeight: gallery.length > 1 ? 'calc(100vh - 170px)' : 'calc(100vh - 80px)', objectFit: 'contain', borderRadius: 4, animation: 'fadeIn .25s ease' }} />
            : <PaletteTile palette={item.palette} label={title} sub={`${item.client} · ${item.year}`} style={{ aspectRatio: '4/5', maxHeight: '78vh' }} />}
          {gallery.length > 1 && (
            <div style={{ display: 'flex', gap: 10, marginTop: 14, flexWrap: 'wrap' }}>
              {gallery.map((src, i) => (
                <button key={src} onClick={() => setImg(i)} aria-label={`image ${i + 1}`} style={{
                  width: 64, height: 64, padding: 0, borderRadius: 3, overflow: 'hidden', cursor: 'pointer',
                  border: `2px solid ${i === img ? cream : 'transparent'}`, opacity: i === img ? 1 : .6,
                  background: 'none', transition: 'opacity .15s',
                }}>
                  <img src={src} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }} />
                </button>
              ))}
            </div>
          )}
        </div>

        {/* Info */}
        <div style={{ paddingTop: 8 }}>
          <div style={{ fontFamily: 'ui-monospace, monospace', fontSize: 11, letterSpacing: '.2em', textTransform: 'uppercase', color: RP.ochre, marginBottom: 14 }}>
            {t[CAT_TKEY[item.cat]] || item.cat}
          </div>
          <div style={{ fontFamily: '"DM Serif Display", Georgia, serif', fontSize: 'clamp(30px, 3.4vw, 44px)', lineHeight: 1.05, marginBottom: 10 }}>{title}</div>
          <div style={{ fontFamily: 'ui-monospace, monospace', fontSize: 11, letterSpacing: '.15em', textTransform: 'uppercase', opacity: .7 }}>{item.client} · {item.year}</div>

          {editions && editions.length > 1 && (
            <div style={{ marginTop: 26 }}>
              <div style={{ fontFamily: 'ui-monospace, monospace', fontSize: 10, letterSpacing: '.2em', textTransform: 'uppercase', opacity: .6, marginBottom: 10 }}>{t.projectEditions}</div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {editions.map((e, i) => (
                  <button key={e.lang} onClick={() => { setEd(i); setImg(0); }} style={{
                    padding: '8px 16px', borderRadius: 999, cursor: 'pointer',
                    border: `1px solid ${i === ed ? cream : 'rgba(249,230,198,.35)'}`,
                    background: i === ed ? cream : 'transparent', color: i === ed ? RP.ink : cream,
                    fontFamily: 'Fraunces, Georgia, serif', fontSize: 14, fontStyle: i === ed ? 'italic' : 'normal',
                  }}>{e.label}</button>
                ))}
              </div>
            </div>
          )}

          {desc && <p style={{ fontSize: 16, lineHeight: 1.65, color: 'rgba(249,230,198,.85)', margin: '26px 0 0', maxWidth: 440 }}>{desc}</p>}

          {item.link && (
            <a href={item.link.url} target="_blank" rel="noreferrer" style={{
              display: 'inline-flex', alignItems: 'center', gap: 8, marginTop: 26, padding: '11px 20px', borderRadius: 999,
              background: RP.ochre, color: RP.ink, textDecoration: 'none', fontFamily: '"DM Serif Display", Georgia, serif', fontSize: 15,
            }}>{linkLabel} <Icon name="arrow-right" size={14} /></a>
          )}

          <div style={{ marginTop: 34 }}>
            <button onClick={onClose} style={{ background: 'none', border: 'none', padding: 0, color: cream, cursor: 'pointer', fontFamily: 'Fraunces', fontStyle: 'italic', fontSize: 15 }}>{t.projectClose} ✕</button>
          </div>
        </div>
      </div>

      <button aria-label="next" className="pv-nav" onClick={(e) => { e.stopPropagation(); onNext(); }} style={navBtn(16, true)}><Icon name="arrow-right" size={20} /></button>
    </div>
  );
}
const navBtn = (inset, right) => ({
  position: 'fixed',
  [right ? 'right' : 'left']: inset,
  top: '50%', transform: 'translateY(-50%)',
  width: 48, height: 48, borderRadius: 999,
  background: 'rgba(249,230,198,.12)', border: '1px solid rgba(249,230,198,.3)', color: '#f9e6c6',
  cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
});

const PAGE_SLUGS = {
  home: '/',
  portfolio: '/portfolio',
  music: '/music',
  press: '/press',
  about: '/about',
  contact: '/contact',
  shop: '/shop',
  work: '/work-with-me',
  shows: '/shows',
};
const SLUG_TO_PAGE = Object.fromEntries(Object.entries(PAGE_SLUGS).map(([k, v]) => [v, k]));

function getInitialPage() {
  // GitHub Pages 404.html SPA redirect via sessionStorage
  const redirect = sessionStorage.getItem('spa_redirect');
  if (redirect) {
    sessionStorage.removeItem('spa_redirect');
    window.history.replaceState(null, '', redirect);
    return SLUG_TO_PAGE[redirect] || 'home';
  }
  const path = window.location.pathname.replace(/\/$/, '') || '/';
  return SLUG_TO_PAGE[path] || 'home';
}

function RefinedSite() {
  const [page, setPage] = useState(getInitialPage);
  const [lb, setLb] = useState(null);
  const { lang, setLang, t } = useI18n();
  useEffect(() => { document.title = `suryaamitrano - ${page}`; }, [page]);

  useEffect(() => {
    const onPop = () => {
      const path = window.location.pathname.replace(/\/$/, '') || '/';
      setPage(SLUG_TO_PAGE[path] || 'home');
      window.scrollTo({ top: 0 });
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);



  const goTo = (p) => {
    setPage(p);
    const slug = PAGE_SLUGS[p] || '/';
    window.history.pushState(null, '', slug);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const openLb = (item) => setLb(item);
  const lbIdx = lb ? PORTFOLIO.findIndex(x => x.id === lb.id) : -1;
  const pageMap = {
    home: <RHome onNav={goTo} t={t} />,
    portfolio: <RPortfolio onOpen={openLb} t={t} />,
    music: <RMusic t={t} />,
    press: <RPress t={t} />,
    shows: <RShows t={t} />,
    about: <RAbout t={t} />,
    contact: <RContact t={t} />,
    shop: <RShop t={t} />,
    work: <RWorkWithMe t={t} />,
  };
  return (
    <div style={{ background: RP.paper, minHeight: '100vh', color: RP.ink, fontFamily: 'Fraunces, Georgia, serif' }}>
      <RefinedHeader page={page} onNav={goTo} lang={lang} setLang={setLang} t={t} />
      <main key={page} style={{ animation: 'pageIn .45s ease' }}>
        <style>{`@keyframes pageIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }`}</style>
        {pageMap[page]}
      </main>
      <RefinedFooter onNav={goTo} t={t} />
      <ProjectView item={lb} lang={lang} t={t} onClose={() => setLb(null)}
        onPrev={() => setLb(PORTFOLIO[(lbIdx - 1 + PORTFOLIO.length) % PORTFOLIO.length])}
        onNext={() => setLb(PORTFOLIO[(lbIdx + 1) % PORTFOLIO.length])} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<RefinedSite />);
</script>
</body>
</html>
